<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#713f24">
  <meta name="description" content="Scanner de QR para comprovantes FP">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>FP — Scanner de comprovantes</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#24201d;background:#f6f2ed}*{box-sizing:border-box}body{max-width:680px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid #ddd2c8;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #4b2e1d12}.actions{display:flex;gap:8px;flex-wrap:wrap}button,textarea{font:inherit}button{min-height:48px;padding:10px 16px;border:1px solid #6c5545;border-radius:10px;background:#fff}.primary{background:#713f24;color:#fff}textarea{width:100%;min-height:96px;padding:10px;border:1px solid #9d8d82;border-radius:9px}video{width:100%;max-height:60vh;background:#17120f;border-radius:10px}.error{border-left:5px solid #b42318}.ok{border-left:5px solid #287a45}.muted{color:#665f5a}[hidden]{display:none!important}
  </style>
</head>
<body>
  <h1>Scanner de comprovantes</h1>
  <p class="muted">A câmera lê o QR e envia somente seu conteúdo à Web App FP. Este site não armazena nem interpreta dados fiscais.</p>
  <section class="card">
    <div class="actions"><button id="scan" class="primary">Escanear QR</button><button id="paste">Colar link</button></div>
    <div id="camera" hidden><video id="video" playsinline muted></video><button id="cancel">Cancelar</button></div>
    <div id="manual" hidden><label for="content">Link completo do QR fiscal</label><textarea id="content" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><button id="send" class="primary">Continuar na Web App</button></div>
  </section>
  <div id="message" class="card" hidden role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
